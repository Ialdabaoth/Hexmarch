<!-- E9 index card, front. Sizes in layout.css use cqw (1% of the card's width), so the screen
     and the 5 x 3 in print match. -->
<div class="face front">
  <div class="head">
    <hexmarch-portrait class="portrait"></hexmarch-portrait>
    <div class="who">
      <h1 class="name"><hexmarch-value key="d.name"></hexmarch-value></h1>
      <div class="sub"><hexmarch-value key="d.title"></hexmarch-value></div>
    </div>
    <hexmarch-action do="xp" class="xp"><span>XP</span><b><hexmarch-value key="d.xp"></hexmarch-value></b></hexmarch-action>
  </div>

  <!-- Stats and weapons read as one block, spaced like the boxes within a row. -->
  <div class="kit">
    <div class="vitals">
      <div class="stats">
        <hexmarch-action do="hp">
          <span>HP</span><b><hexmarch-if key="frame.live"><hexmarch-value key="d.hp"></hexmarch-value> </hexmarch-if><hexmarch-if key="frame.live" not><i class="blank"></i></hexmarch-if>/ <hexmarch-value key="d.hpMax"></hexmarch-value></b>
        </hexmarch-action>
        <hexmarch-roll check="dice" key="d.hitDie" label="Hit die" min="1"><span>Hit die</span><b><hexmarch-value key="d.hitDie"></hexmarch-value></b></hexmarch-roll>
        <hexmarch-action do="armor"><span>Armor</span><b><hexmarch-value key="d.defense"></hexmarch-value></b></hexmarch-action>
        <hexmarch-action do="carry" hexmarch-class="over:d.carry.encumbered"><span>Carry</span><b><hexmarch-value key="d.carry.load"></hexmarch-value>/<hexmarch-value key="d.carry.capacity"></hexmarch-value></b></hexmarch-action>
      </div>
      <hexmarch-roll check="attack" key="d.attacks.melee" label="Melee attack" class="atk"><span>Melee</span><b><hexmarch-value key="d.attacks.melee"></hexmarch-value>+</b></hexmarch-roll>
      <hexmarch-roll check="attack" key="d.attacks.ranged" label="Ranged attack" class="atk"><span>Ranged</span><b><hexmarch-value key="d.attacks.ranged"></hexmarch-value>+</b></hexmarch-roll>
    </div>

    <!-- Two hands: tap a name to change what's held, tap the dice to roll damage.
         A weapon held in both hands greys out the off hand. -->
    <div class="hands">
      <div class="hand">
        <hexmarch-action do="main" class="slot"><span>Main hand</span><b><hexmarch-value key="d.mainName"></hexmarch-value></b></hexmarch-action>
        <hexmarch-roll check="damage" key="d.mainDamage" class="chip"><hexmarch-value key="d.damage"></hexmarch-value></hexmarch-roll>
      </div>
      <div class="hand" hexmarch-class="blocked:d.mainHeavy">
        <hexmarch-action do="off" off="d.mainHeavy" class="slot"><span>Off hand</span><b hexmarch-class="aside:d.bothHands"><hexmarch-value key="d.offName"></hexmarch-value></b></hexmarch-action>
        <hexmarch-if key="d.offNote"><span class="chip note"><hexmarch-value key="d.offNote"></hexmarch-value></span></hexmarch-if>
      </div>
    </div>
  </div>

  <div class="abilities">
    <hexmarch-each list="d.abilities" as="a">
      <hexmarch-roll check="save" key="a.id" class="ab">
        <span class="lbl"><hexmarch-value key="a.short"></hexmarch-value> <hexmarch-value key="a.score"></hexmarch-value></span>
        <span class="save">vs. <hexmarch-value key="a.save"></hexmarch-value></span>
        <b><hexmarch-value key="a.threshold"></hexmarch-value>+</b>
      </hexmarch-roll>
    </hexmarch-each>
  </div>
</div>
