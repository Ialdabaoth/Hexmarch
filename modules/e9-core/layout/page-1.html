<!-- E9 full sheet, US letter. Sections flow onto extra pages as inventories grow;
     no section is split across a page break unless it is longer than a page. -->
<div class="pg">
  <div class="head">
    <hexmarch-portrait class="portrait"></hexmarch-portrait>
    <div class="who">
      <h1 class="name"><hexmarch-value key="d.name"></hexmarch-value></h1>
      <div class="sub"><hexmarch-value key="d.title"></hexmarch-value> · Hit die <hexmarch-value key="d.hitDie"></hexmarch-value> · XP <hexmarch-value key="d.xp"></hexmarch-value></div>
    </div>
    <div class="brand"><hexmarch-value key="d.brand"></hexmarch-value></div>
  </div>

  <div class="vitals">
    <div><span>Hit points</span><b><i class="blank"></i> / <hexmarch-value key="d.hpMax"></hexmarch-value></b></div>
    <div><span>Armor</span><b><hexmarch-value key="d.defense"></hexmarch-value></b><small><hexmarch-value key="d.wornName"></hexmarch-value></small></div>
    <div><span>Melee</span><b><hexmarch-value key="d.attacks.melee"></hexmarch-value>+</b></div>
    <div><span>Ranged</span><b><hexmarch-value key="d.attacks.ranged"></hexmarch-value>+</b></div>
    <div><span>Carry</span><b><hexmarch-value key="d.carry.load"></hexmarch-value> / <hexmarch-value key="d.carry.capacity"></hexmarch-value></b><small>enc. over <hexmarch-value key="d.carry.threshold"></hexmarch-value></small></div>
  </div>

  <div class="grid-2">
    <section class="sec">
      <h2 class="h2">Abilities and saves</h2>
      <table class="tbl">
        <tbody>
          <hexmarch-each list="d.abilities" as="a">
            <tr><th><hexmarch-value key="a.name"></hexmarch-value></th><td class="num"><hexmarch-value key="a.score"></hexmarch-value></td><td>Save vs. <hexmarch-value key="a.save"></hexmarch-value></td><td class="num"><hexmarch-value key="a.threshold"></hexmarch-value>+</td></tr>
          </hexmarch-each>
        </tbody>
      </table>
    </section>

    <section class="sec">
      <h2 class="h2">Talents <small>(d6, * expertise)</small></h2>
      <table class="tbl">
        <tbody>
          <hexmarch-each list="d.talents" as="t">
            <tr><th><hexmarch-value key="t.label"></hexmarch-value></th><td class="num"><hexmarch-value key="t.threshold"></hexmarch-value>+</td><td class="use"><hexmarch-value key="t.use"></hexmarch-value></td></tr>
          </hexmarch-each>
        </tbody>
      </table>
    </section>

    <section class="sec">
      <h2 class="h2">Weapons</h2>
      <table class="tbl">
        <tbody>
          <hexmarch-each list="d.weapons" as="w" min="3">
            <tr hexmarch-class="empty:w.blank"><th><hexmarch-value key="w.label" empty="&nbsp;"></hexmarch-value></th><td><hexmarch-value key="w.damage"></hexmarch-value></td><td><hexmarch-value key="w.info"></hexmarch-value></td><td class="num"><hexmarch-value key="w.hit"></hexmarch-value></td></tr>
          </hexmarch-each>
        </tbody>
      </table>
    </section>

    <section class="sec">
      <h2 class="h2"><hexmarch-value key="d.cls.name"></hexmarch-value> <small><hexmarch-value key="d.cls.book"></hexmarch-value> p. <hexmarch-value key="d.cls.page"></hexmarch-value></small></h2>
      <ul class="list features">
        <hexmarch-each list="d.features" as="f"><li><b><hexmarch-value key="f.name"></hexmarch-value>.</b> <hexmarch-value key="f.summary"></hexmarch-value></li></hexmarch-each>
      </ul>
      <hexmarch-if key="d.cls.martial"><p class="small"><hexmarch-value key="d.cls.martial"></hexmarch-value>.</p></hexmarch-if>
    </section>

    <hexmarch-if key="d.magicItems">
      <section class="sec wide">
        <h2 class="h2">Magic items</h2>
        <ul class="list features">
          <hexmarch-each list="d.magicItems" as="m"><li><b><hexmarch-value key="m.source"></hexmarch-value>:</b> <hexmarch-value key="m.text"></hexmarch-value></li></hexmarch-each>
        </ul>
      </section>
    </hexmarch-if>

    <section class="sec wide">
      <h2 class="h2">Inventory</h2>
      <ul class="list items">
        <hexmarch-each list="d.items" as="i" min="6"><li hexmarch-class="empty:i.blank"><hexmarch-value key="i.label" empty="&nbsp;"></hexmarch-value></li></hexmarch-each>
      </ul>
    </section>

    <hexmarch-if key="d.magic.prepared">
      <section class="sec">
        <h2 class="h2"><hexmarch-value key="d.magic.prepared"></hexmarch-value></h2>
        <table class="tbl">
          <tbody>
            <hexmarch-each list="d.prepared" as="p" min="3">
              <tr hexmarch-class="empty:p.blank"><td class="box"><hexmarch-value key="p.box" empty="☐"></hexmarch-value></td><td><hexmarch-value key="p.circle"></hexmarch-value></td><th><hexmarch-value key="p.magic" empty="&nbsp;"></hexmarch-value></th></tr>
            </hexmarch-each>
          </tbody>
        </table>
      </section>
      <section class="sec">
        <h2 class="h2"><hexmarch-value key="d.magic.book"></hexmarch-value></h2>
        <table class="tbl">
          <tbody>
            <hexmarch-each list="d.book" as="b"><tr><td><hexmarch-value key="b.circle"></hexmarch-value></td><th><hexmarch-value key="b.magic"></hexmarch-value></th></tr></hexmarch-each>
            <hexmarch-if key="d.book" not><tr class="empty"><td></td><th>&nbsp;</th></tr></hexmarch-if>
          </tbody>
        </table>
      </section>
    </hexmarch-if>

    <hexmarch-if key="d.followers">
      <section class="sec wide">
        <h2 class="h2">Retinue</h2>
        <table class="tbl">
          <thead><tr><th>Name</th><th>Kind</th><th>HP</th><th>Attitude</th><th>Traits and notes</th></tr></thead>
          <tbody>
            <hexmarch-each list="d.followers" as="f">
              <tr><th><hexmarch-value key="f.name"></hexmarch-value></th><td><hexmarch-value key="f.kind"></hexmarch-value></td><td class="num"><hexmarch-value key="f.hpMax"></hexmarch-value></td><td><hexmarch-value key="f.attitude"></hexmarch-value></td><td class="use"><hexmarch-value key="f.notes"></hexmarch-value></td></tr>
            </hexmarch-each>
          </tbody>
        </table>
      </section>
    </hexmarch-if>

    <section class="sec wide">
      <h2 class="h2">Level history</h2>
      <table class="tbl">
        <tbody>
          <hexmarch-each list="d.levels" as="l">
            <tr><th>Level <hexmarch-value key="l.level"></hexmarch-value></th><td>+<hexmarch-value key="l.hp"></hexmarch-value> HP</td><td><hexmarch-value key="l.trained"></hexmarch-value></td><td class="use"><hexmarch-value key="l.feat"></hexmarch-value></td></tr>
          </hexmarch-each>
        </tbody>
      </table>
    </section>

    <section class="sec wide notes">
      <h2 class="h2">Notes</h2>
      <p class="notes-text"><hexmarch-value key="flavor.notes"></hexmarch-value></p>
    </section>
  </div>
  <div class="foot"><hexmarch-value key="d.appName"></hexmarch-value> · <hexmarch-value key="d.rulesName"></hexmarch-value> rules</div>
</div>
