<!-- E9 index card, back. -->
<div class="face back">
  <!-- One column per ability, its three talents underneath. -->
  <div class="talents">
    <hexmarch-each list="d.talentColumns" as="col">
      <div class="tcol">
        <hexmarch-each list="col.talents" as="t">
          <hexmarch-roll check="talent" key="t.id" class="tal"><span><hexmarch-value key="t.label"></hexmarch-value></span><b><hexmarch-value key="t.threshold"></hexmarch-value>+</b></hexmarch-roll>
        </hexmarch-each>
      </div>
    </hexmarch-each>
  </div>

  <div class="cols">
    <div>
      <h2 class="h2">Class Feats</h2>
      <ul class="list"><hexmarch-each list="d.features" as="f"><li><hexmarch-value key="f.name"></hexmarch-value></li></hexmarch-each></ul>
      <hexmarch-each list="d.feats" as="l"><div class="note">L<hexmarch-value key="l.level"></hexmarch-value>: <hexmarch-value key="l.feat"></hexmarch-value></div></hexmarch-each>
    </div>
    <div>
      <hexmarch-if key="d.magic.prepared">
        <h2 class="h2"><hexmarch-value key="d.magic.prepared"></hexmarch-value></h2>
        <ul class="list">
          <hexmarch-each list="d.prepLines" as="p">
            <hexmarch-if key="frame.edit">
              <hexmarch-if key="p.filled">
                <li class="tagged"><span class="tag circle"><hexmarch-value key="p.tag"></hexmarch-value></span><hexmarch-action do="prep" key="p.i" off="p.off" class="prep" hexmarch-class="spent:p.spent"><hexmarch-if key="p.spent"><span class="act">Prepare</span></hexmarch-if><span class="what"><hexmarch-value key="p.magic"></hexmarch-value></span></hexmarch-action></li>
              </hexmarch-if>
              <hexmarch-if key="p.filled" not>
                <li class="tagged"><span class="tag circle"><hexmarch-value key="p.tag"></hexmarch-value></span><hexmarch-action do="prepslot" key="p.circle" off="p.off" class="prep empty"><span class="act">Prepare</span><span class="what">________</span></hexmarch-action></li>
              </hexmarch-if>
            </hexmarch-if>
            <hexmarch-if key="frame.edit" not>
              <li hexmarch-class="muted:p.empty"><hexmarch-value key="p.text"></hexmarch-value></li>
            </hexmarch-if>
          </hexmarch-each>
          <hexmarch-if key="d.prepMore"><li class="muted"><hexmarch-value key="d.prepMore"></hexmarch-value></li></hexmarch-if>
        </ul>
      </hexmarch-if>
      <hexmarch-if key="d.magic.prepared" not>
        <h2 class="h2">Gear</h2>
        <ul class="list">
          <hexmarch-each list="d.cardItems" as="i"><li><hexmarch-value key="i.label"></hexmarch-value></li></hexmarch-each>
          <hexmarch-if key="d.cardItemsMore"><li class="muted"><hexmarch-value key="d.cardItemsMore"></hexmarch-value></li></hexmarch-if>
        </ul>
      </hexmarch-if>
    </div>
    <div>
      <h2 class="h2">Equipped Items</h2>
      <ul class="list">
        <hexmarch-each list="d.equipped" as="s">
          <hexmarch-if key="frame.edit">
            <li class="tagged"><span class="tag slot"><hexmarch-value key="s.label"></hexmarch-value></span><hexmarch-action do="equip" key="s.id" class="prep"><span class="what"><hexmarch-value key="s.name" empty="—"></hexmarch-value></span></hexmarch-action></li>
          </hexmarch-if>
          <hexmarch-if key="frame.edit" not>
            <li><hexmarch-value key="s.label"></hexmarch-value> <hexmarch-value key="s.name"></hexmarch-value></li>
          </hexmarch-if>
        </hexmarch-each>
      </ul>
    </div>
  </div>
</div>
